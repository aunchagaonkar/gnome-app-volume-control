name: Bug report
description: Report a problem with App Volume Control
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail to reproduce it.

  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      description: "For example: 50"
      placeholder: "50"
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Linux distribution and version
      placeholder: "For example: Fedora 44"
    validations:
      required: true

  - type: dropdown
    id: audio-backend
    attributes:
      label: Audio backend
      options:
        - PipeWire
        - PulseAudio
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem occurred?
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste relevant GNOME Shell errors, if available.
      render: text
    validations:
      required: false
